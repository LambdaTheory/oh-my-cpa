# PRD：跨凭证额度拆借（显示层与建议层）

状态：待评审
日期：2026-11-23
来源：2026-11-23 需求原话（T7 切片 S2）、同交付目录 `research.md`（T7-S1 调研）、控制台与额度现状的只读核对

## 1. 背景与目标

两台 Codex Pro 200 凭证的周限额不同步：A 还剩 88%，11/27 才自然重置；B 只剩 40%，11/25 就自然重置。现在的控制台能看到每张卡的剩余百分比，也能在每个窗口下面看到一句重置倒计时，但看不出「谁该多用、谁该省着用」：两张卡都是合法路由目标，凭感觉分配流量，B 很可能在回满前先耗尽，A 又撑不到 11/27。

正确的用法不是平均分，也不是只看剩余百分比，而是按「谁离自然重置更远、相对余量更宽裕」排优先级：这两天偏用 A、少用 B，把 B 的 40% 留到 11/25 回满；之后按同样的口径重算，角色由当时的余量和重置时间决定。

**目标**：让运营人员在凭证列表上同时看到「每张卡离自然重置还有多久」和「同池凭证里先偏用谁、少用谁、为什么」，并且这份建议只读、可解释、数据不全时明确停手。

**成功标准**：

- 不打开凭证详情，就能在列表行看到每个窗口的剩余百分比、距自然重置的倒计时和「快重置 · 余量高 / 低」标记。
- 能把列表按「距自然重置最近」排序，一眼分出「快重置但额度还高」和「快重置且额度低」。
- 同 provider、同套餐的两张以上凭证出现一条跨卡建议，写明偏用谁、少用谁、依据的读数时刻、每张卡的数字和建议有效期。
- 缺重置时刻、读数过期、窗口口径不同、可用卡不足时，建议显示「无法建议」及逐卡原因，不猜、不退回只按剩余百分比排序。
- 建议只读：页面上没有任何写入 CPA 路由、消耗重置权益的动作。

> [!注意] 本文的 4 个待确认
> q01 路由权重（4.9）、q02 建议窗口范围（4.4）、q03 比较口径（4.5）、q04 快重置标记（4.2）。评审页页首可以逐条点选；整页不看或全部不选时按推荐定稿。

## 2. 用户与场景

| 角色 | 场景 | 关心什么 |
|---|---|---|
| 运营人员 | 早上打开凭证列表，决定今天哪张卡多承接流量 | 每张卡离自然重置还有多久；同套餐里先偏用谁、少用谁；理由是否可信 |
| 值班人员 | 某张卡余量快速下降，临时调整用法 | 快重置的卡还剩多少、会不会在回满前耗尽；建议的有效期到什么时候 |
| 负责额度成本的人 | 判断跨卡建议值不值得照着做 | 建议依据的读数时间、重置精度、数据不全时会不会乱给 |

## 3. 范围

### 做

- 显示层：列表行强化「距自然重置还有多久」，新增快重置标记，新增按距自然重置排序。
- 建议层：同 provider + 同套餐的凭证组成可拆借池，给出偏用 / 少用 / 均衡的只读建议、理由和有效期。
- 建议层的数据不全降级：逐卡写原因，明确「无法建议」。
- 列表页与凭证详情两处展示同一份池建议，并写清与现有单卡重置权益建议的区别。

### 不做

- 不写 CPA 的 priority / weight，不做自动路由、自动切凭证、自动停用（是否落路由权重见 4.9 的待确认 q01）。
- 不改现有单卡重置权益建议的语义、阈值、位置和动作。
- 不消耗 Codex 重置次数 / Claude 重置授权，不新增上游采集，不新增通知。
- 不覆盖 5 小时、滚动、模型级、分组级窗口的建议；这些窗口只在单卡行里照常展示。
- 不做「按模型可用性筛选池」、不做跨 provider 拆借、不做历史趋势曲线。

## 4. 功能需求

### 4.1 口径与术语

先把判断用的词定死，后面所有界面、数字和建议都用这一套。

| 术语 | 定义 | 判不准时 |
|---|---|---|
| 自然重置 | 额度窗口按自身周期回满的时刻；只认读数里的具体时刻，精确或推算都算，只有文字不算 | 显示上游文字并标「时刻未知」，不换算、不猜时刻 |
| 可拆借同池 | 同 provider + 同 plan_type 的多张凭证；至少两张有可比较的长窗口读数 | plan_type 缺失或未知 → 不进池，在面板底部计入「未参与」 |
| 长窗口 | 凭证自己的标准窗口，周期 ≥ 24 小时（日 / 周 / 月） | 周期未知 → 不算长窗口，不参与建议 |
| 建议窗口 | 一张卡所有长窗口中剩余百分比最低的那个；同池各卡的建议窗口类型相同才可比较 | 类型不同 → 「无法建议：窗口口径不同」，不跨类型比较 |
| 重置前日均可用 | 剩余百分比 ÷ 距自然重置的天数，单位「%/天」；距重置不足 1 小时按 1 小时算 | 缺剩余或重置时刻 → 该卡不可参与比较 |
| 有效读数 | 沿用现有额度鲜度界：至少 2 小时，长窗口按周期的 1/4，最多 24 小时 | 超过 → 该卡「读数过期」，不参与比较 |
| 快重置 | 距自然重置不超过窗口周期的 1/3 | 周期未知 → 不打标记 |
| 余量高低 | 剩余 ≥ 50% 为高，< 50% 为低 | 剩余缺失 → 只打「快重置」或「时刻未知」，不硬分高低 |
| 可服务 | 没有已耗尽且未重置的标准窗口，不在 CPA 冷却、不需要重新授权、不是停用状态 | 不可服务 → 不参与偏用排名，其他卡照常比较 |

> [!决策] 同池 = 同 provider + 同 plan_type
> 调研确认现成的可比键只有 provider 和套餐；套餐不同则模型访问范围、额度规模和重置周期都可能不同，不能互相替代。`type` 不再细分：能发布窗口读数的凭证已经有共同的可观测口径，再按 OAuth / API key 分池会把同一套餐的卡拆散。同一账号下的多张凭证不互相拆借：读数会完全相同，日均可用自然落进「均衡」，不会给出错误偏用；如能确认是同一账号，直接排除在池外。
>
> 判不准时宁可少建议：plan_type 未知就不进池，不按 provider 把不同套餐硬凑在一起。

> [!决策] 只比较长窗口
> 5 小时窗口重置太快，拿它排「撑到重置」的优先级会来回跳；模型级和分组级窗口口径不同，不能放在一张表里比。日 / 周 / 月窗口才是「省额度、等回满」有意义的对象。短的 5 小时窗口照常显示倒计时和快重置标记，只是不参与跨卡建议。

> [!注意] 建议不改变现有额度状态
> 拆借建议只读：它不刷新额度、不清冷却、不换凭证、不改单卡状态，也不影响现有的额度预测和告警。页面上看到的数字和没有这个功能时完全一致，多出来的只是比较和结论。

### 4.2 显示层：单卡的重置倒计时与标记（主流程）

现有的行内已经有「重置倒计时」，但它只是进度条下面的一行小字，没有标签、没有排序，也没区分「快重置时余量高还是低」。本版把它强化成一眼可读的信息，不改变数据本身。


<div class="nz-slot" data-fig="0"></div>


规则：

- 每个有读数的窗口都显示「距重置 X」，X 按分钟 / 小时 / 天显示；有具体时刻的同时显示日期。重置时刻是推算或近似的，数字前带 `~`，鼠标悬停能看到完整时刻和精度说明。
- 只有上游文字、没有具体时刻的窗口保留原文（例如「11 月 27 日下午」），并标「时刻未知」；不把文字换算成假时刻，也不显示倒计时。
- 距重置 ≤ 窗口周期的 1/3 时打「快重置」标记；剩余 ≥ 50% 显示「快重置 · 余量高」，< 50% 显示「快重置 · 余量低」。同一张卡的不同窗口可以一个高一个低，标记跟着窗口走，不汇总到卡上。
- 标记只用文字和颜色，不只用颜色；颜色语义沿用现有状态色：余量高用信息色，余量低用注意色。


<div class="nz-slot" data-scr="0"></div>



<div class="nz-slot" data-pend="0"></div>


### 4.3 显示层：按距自然重置排序

- 排序选项新增「距自然重置最近」，和其他排序并列放在列表筛选里。
- 排序键取每张卡所有**标准长窗口**中最早的自然重置时刻，按升序排：快到重置的在前，离重置远的在后。
- 没有长窗口、没有重置时刻的卡排在最后，不参与比较；短窗口（5 小时、滚动等）不参与排序键。
- 同一时刻或都未知时，按剩余百分比低者在前（更可能需要处理），再按名称排，保证每次排列稳定。
- 选择会像其他排序一样被记住，下次打开保持；点「重置筛选」回到默认的名称排序。

> [!注意] 排序和排序键不是一回事
> 行里可能同时有 5 小时和周两个窗口，但排序只看长窗口——否则一张 5 小时窗口还剩 20 分钟的卡会永远排第一，而运营真正要比较的是周窗口的余量和重置时间。短窗口的快重置标记照常显示，只是不决定顺序。

### 4.4 建议层：同池偏用建议（主流程）

建议层的输入就是列表页已经加载的那批凭证和额度读数，不额外向上游请求；输出是一段可解释的只读结论。


<div class="nz-slot" data-fig="1"></div>


默认展示规则：

- 面板按池显示，一个池一行标题加每张卡一行；池按「最早的自然重置」从近到远排，最紧迫的池排最前。
- 每张卡一行：角色、凭证名、建议窗口的剩余百分比、距自然重置、重置前日均可用。角色只有偏用 / 少用 / 均衡 / 正常四种；「无法建议」是池级状态，逐卡只写原因，不硬塞角色。
- 理由句只回答两件事：谁更快自然重置、谁相对更宽裕；数字必须和三列一致，不写没有依据的判断。
- 有效期写到同池最早的自然重置时刻；到点后按新读数重算，角色可能保持也可能互换，由当时的余量和重置时间决定，不承诺「回满就一定翻盘」。


<div class="nz-slot" data-scr="1"></div>



<div class="nz-slot" data-pend="1"></div>


### 4.5 建议层的判定口径

对每张可参与比较的卡，算「重置前日均可用」：

**重置前日均可用 = 剩余百分比 ÷ 距自然重置的天数**（距重置不足 1 小时按 1 小时算，结果保留一位小数）

主轴仍然是自然重置时刻：每张卡的比较都以它自己的下一次自然重置为终点，剩余百分比只表示「到那个终点还剩多少」。它回答的是「这张卡在回满前每天最多能承接多少」，不是「现在剩多少」。两张卡的重置时刻不同，光比剩余百分比会把「快重置、余量低」的卡误判成更穷；光比重置时间又会把「快重置、余量高」的卡不必要地少用。

| 场景 | A 卡 | B 卡 | 日均可用 | 建议 |
|---|---|---|---|---|
| 本次两台 Codex Pro 200 | 剩 88%，3.9 天后重置 | 剩 40%，2.3 天后重置 | A 22.6，B 17.6 | 偏用 A、少用 B：B 的 40% 先保住，等 11/25 回满 |
| 快重置但余量高 | 剩 30%，4 天后重置 | 剩 95%，1 天后重置 | A 7.5，B 95 | 偏用 B：B 明天就回满，今天用它不会伤到重置前的余量 |
| 快重置但余量低 | 剩 5%，30 天后重置 | 剩 80%，2 天后重置 | A 0.2，B 40 | A 低于 10% 门槛、不参与比较；只剩 B 一张，不给偏用结论，A 留作应急 |
| 两张差不多 | 剩 60%，4 天后重置 | 剩 58%，4 天后重置 | A 15.0，B 14.5 | 均衡使用：差值不到 1 个百分点/天，不值得特意偏 |

判定顺序：

1. 停用的凭证不计入池；池成员不足两张时不成池、不显示建议。
2. 池成员的比较数据有任一无效（缺建议窗口、缺重置时刻、读数过期）或建议窗口类型不同时，整池「无法建议」，逐卡写原因。未知的卡可能是最宽裕的那张，不能假装它不存在。
3. 数据都有效时，算每张卡的日均可用，并标出不能承接当前流量的卡：冷却中、需要重新授权、读取失败、已耗尽、有标准窗口耗尽且未重置、剩余低于 10%。这些卡不参与偏用排名，但要在原因里逐张列出。
4. 可服务的卡按日均可用从高到低排：最高的标「偏用」，最低的标「少用」，中间标「正常」。
5. 若最高与最低的差小于 1 个百分点/天，全部标「均衡使用」，不给偏用 / 少用；差值达到 1 个百分点/天才分先后。
6. 可服务的卡不足两张时，不给偏用结论；把受限卡、原因和它们各自的距离写出来。

> [!决策] 用「重置前日均可用」而不是只看剩余百分比
> 剩余百分比高不代表这几天更宽裕：一张 70% 但 30 天后才重置的卡，每天只能用 2.3%；一张 40% 但 2 天后就回满的卡，每天能用 17.6%。日均可用把重置时间放进分母，既尊重「谁快重置谁先回满」的直觉，又能处理「快重置但余量很高」的反例。纯按重置时刻从晚到早排会把「明天重置、还剩 95%」的卡不必要地少用；纯按剩余百分比排则正是这次要避免的平均主义。


<div class="nz-slot" data-pend="2"></div>


### 4.6 建议层的数据不全与降级


<div class="nz-slot" data-fig="2"></div>


| 情况 | 显示 | 运营人员下一步 |
|---|---|---|
| 缺重置时刻（只有文字） | 该卡「重置时刻未知」，整池「无法建议」 | 等上游给出具体时刻，或核对凭证的额度读取是否正常 |
| 读数过期 | 该卡「读数已过期，最后读数在 N 小时前」 | 刷新该卡额度，等新读数 |
| 缺长窗口 / 没有剩余百分比 | 该卡「没有可比较的长窗口」 | 核对凭证是否发布了日 / 周 / 月窗口 |
| 剩余低于 10% | 该卡「余量低于 10%，不参与偏用排名」；其他可服务的卡照常比较 | 等刷新或重置后再看；这张卡留作应急 |
| 冷却中 / 需要重新授权 / 读取失败 | 该卡「暂不可承接流量」，不参与偏用排名；其他可服务的卡照常比较 | 处理该卡的状态，或等冷却结束 |
| 已耗尽 / 某标准窗口耗尽且未重置 | 该卡「当前无可用余量」，不参与偏用排名 | 等重置或补额度 |
| 各卡瓶颈窗口类型不同 | 整池「窗口口径不同」并列出每张卡的窗口类型 | 分别看单卡；等出现同类型窗口再比较 |
| 可服务的卡不足两张 | 整池「无法给出偏用结论」，列出受限卡和原因 | 处理受限卡（刷新、等冷却、重新授权） |
| 同套餐只有一张 | 不显示池，计入底部「未参与」 | 正常情况，不需要处理 |

> [!注意] 「无法建议」不是「均衡使用」
> 均衡是「比较过，差别不大」；无法建议是「压根没得比」。两者不能共用文案，也不给偏用结论。读数过期、缺时刻、窗口口径不同都不能降级成「按剩余百分比排」——那正是这次要避免的算法。

> [!注意] 本节只写降级，不重复口径
> 比较口径见 4.5（q03），窗口范围见 4.4（q02）；这里只列数据不全时怎么显示、下一步做什么。

### 4.7 建议在哪里出现：列表页与凭证详情

同一份池建议在两处出现，数字、理由、有效期必须一致：

- **列表页顶部**：所有池的汇总，先给「最紧迫的池」，运营人员不进详情就能照着做；池多时按最早重置排序，保证最紧迫的池先出现。
- **凭证详情的额度页**：这张卡属于哪个池、当前角色、同池还有谁、同一句理由和有效期。它回答的是「这张卡在池里处于什么位置」，不是另一份独立建议。
- 如果这张卡不在任何池里，详情页写原因：套餐未知、同套餐不足两张、没有长窗口、读数不可用；不显示空白的「建议」区块。


<div class="nz-slot" data-scr="2"></div>


### 4.8 与单卡重置权益建议的关系

现在的「重置权益建议」回答的是另一件事：Codex 的重置次数、Claude 的重置授权要不要在到期前用掉。它只看一张卡、只覆盖 codex / claude、要求 2 小时内的权益读数，不比较其他凭证。本版新增的拆借建议看的是自然重置前的流量分配，不碰重置权益。两者必须分开。

| 维度 | 拆借建议（本版新增） | 重置权益建议（原有，不改） |
|---|---|---|
| 回答 | 接下来偏用哪张卡、少用哪张 | 要不要在到期前用掉重置次数 / 授权 |
| 数据 | 窗口剩余百分比、自然重置时刻、读数鲜度 | 重置次数 / 授权的余额和到期时间，2 小时内的权益读数 |
| 范围 | 同 provider + 同套餐的池 | 单卡；只覆盖 codex / claude |
| 输出 | 偏用 / 少用 / 均衡 / 无法建议 | 到期前用掉 / 留给恢复 / 不用管 / 证据不足 |
| 动作 | 无，纯只读 | 有消耗重置权益的既有动作，位置和语义不变 |

> [!决策] 不合并两种建议
> 合并会让「省额度」和「用掉权益」两个相反的动作出现在同一个结论里，运营人员分不清该不该点；也会把只覆盖 codex / claude 的权益口径扩散到所有 provider。两套文案、两个位置、两套数据，各自回答各自的问题。

### 4.9 路由权重：本期不做，待确认

调研确认 priority / weight 是 CPA 的调度字段：高 priority 先被选中；weight 只在加权轮询且同优先级内生效，0 会把凭证排除在外；fill-first / round-robin 忽略 weight；已有的会话可能仍绑定在原凭证上。改它确实会让线上所有请求的走向发生变化，而项目边界是「不做自动路由，不进 CPA 请求路径」。所以本版只做提示，是否再往前走一步由 q01 决定。

| 路径 | 做什么 | 后果 | 与项目边界的关系 | 本版 |
|---|---|---|---|---|
| 只提示 | 控制台展示偏用 / 少用 | 对线上零影响；照建议做仍靠人 | 不触碰边界 | 做 |
| 人工确认后写 priority / weight | 给一个「按建议调整」的受控动作 | 影响线上所有请求；策略、权重和会话亲和可能让效果打折；需要回滚和审计 | 不是自动路由，但改的是线上调度，要单独立项 | 不做，等 q01 |
| 按建议自动写 | 持续按建议改权重 | 等于把建议变成自动路由 | 越过边界 | 不做 |

> [!风险] weight 不保证按建议生效
> 如果 CPA 用 fill-first 或 round-robin，weight 不参与选择；如果会话已经绑定到某张凭证，priority / weight 也不会立刻改道。即便未来决定写权重，也只能当「偏置」而不是「保证」。

## 5. 验收标准

- **AC-1** 每张凭证的每个有读数的窗口，行内显示剩余百分比和「距重置 X」倒计时；没有读数的行说明缺的是哪种读数；有具体重置时刻才显示倒计时，只有文字时保留上游文字并标「时刻未知」；推算或近似时刻带 `~`。
- **AC-2** 距重置不超过窗口周期 1/3 的窗口带「快重置」标记；剩余 ≥ 50% 标「余量高」，< 50% 标「余量低」；周期未知时不打标记；标记以文字表达，不只靠颜色。
- **AC-3** 排序新增「距自然重置最近」，按每张卡所有标准长窗口中最早的自然重置时刻升序排；没有长窗口或没有重置时刻的排最后；短窗口不参与排序；同刻按剩余百分比低者在前，再按名称。
- **AC-4** 「距自然重置最近」与其他排序一样被记住，刷新后保持；点「重置筛选」回到名称排序。
- **AC-5** 同池只由同 provider + 同 plan_type 的凭证组成；plan_type 缺失或未知的凭证不进任何池；同套餐不足两张时不显示池；未参与池的凭证数量和原因在空状态或面板底部汇总。
- **AC-6** 只有标准且周期 ≥ 24 小时的窗口参与建议；每张卡取剩余百分比最低的长窗口作为建议窗口；同池各卡的建议窗口类型不同时不给偏用建议。
- **AC-7** 重置前日均可用 = 剩余百分比 ÷ 距重置天数（不足 1 小时按 1 小时）；最高者标「偏用」，最低者标「少用」；最高与最低差小于 1 个百分点/天时全部标「均衡使用」，不分偏用 / 少用。
- **AC-8** 停用的凭证不计入池；冷却中、需要重新授权、读取失败、已耗尽、有标准窗口耗尽且未重置、剩余 < 10% 的卡不参与偏用排名；可服务的卡不足两张时不就偏用给结论，但要列出受限卡和原因。
- **AC-9** 建议块显示有效期（同池最早的自然重置时刻）、每张卡的建议窗口、剩余百分比、距重置、日均可用和一句理由；理由说清谁更快重置、谁更宽裕，数字与三列一致。
- **AC-10** 缺重置时刻、读数过期、缺长窗口、建议窗口类型不同时，整池显示「无法建议」并逐卡写原因；可服务的卡不足两张时不给偏用结论并列出受限卡；不得退回只按剩余百分比给建议。
- **AC-11** 重置时刻为推算或近似时，建议照常给但带 `~` 并标「参考」；差值落在门槛内时按均衡处理。
- **AC-12** 建议只读：没有应用、写入、切换路由、消耗重置权益的按钮；不改变 CPA 配置和线上请求走向。
- **AC-13** 原有单卡重置权益建议的语义、位置、阈值和动作不变；拆借建议与它在页面上分区展示，文案不混用；拆借建议不提重置次数 / 授权，重置权益建议不提偏用 / 少用。
- **AC-14** 无同池或全部不可比较时，面板显示空状态并说明原因；未参与池的凭证数量与原因在空状态或面板底部汇总，不无声跳过。
- **AC-15** 列表页和凭证详情展示同一份池建议；详情里的角色、数字、理由、有效期与列表页一致；详情能看出该卡属于哪个池，或为什么不在任何池。
- **AC-16** 所有时间按控制台现有生效时区显示；倒计时随页面时钟推进更新，建议随页面时钟重算，不额外请求上游。
- **AC-17** 不改变现有额度采集、预测、单卡状态和通知；建议不落库、不推送、不产生新的历史记录。（非界面）

## 6. 非功能需求

- **性能**：建议只用列表页已经加载的凭证和读数计算，不新增逐卡请求；页面加载和刷新额度的行为不变。
- **时区**：所有时刻沿用控制台生效时区，倒计时和日期使用同一时区；跨时区查看时数字不漂移。
- **可访问性**：状态和标记用文字加颜色，不只靠颜色；窄屏（≤ 760px）时建议面板和凭证行改为单列，不横向滚动。
- **兼容**：旧网关或旧凭证没有 plan_type 时，退化为「套餐未知、不进池」，不报错、不隐藏凭证；没有长窗口的 provider 只显示单卡信息。
- **数据**：建议不落库、不推送、不产生新的历史记录；关闭页面即结束，下次打开按最新读数重算。
- **权限**：整个功能只读；不新增写 CPA 配置、写凭证字段、消耗重置权益的入口。

## 7. 风险与待定

> [!风险] 重置时刻是推算值时，临界判断可能翻转
> Codex 只有「距现在多少秒」时，重置时刻是推算值；读数刷新后可能前后移动几个小时。缓解：行内和池内都带 `~` 和「参考」，日均可用差不到 1 个百分点/天按均衡处理，不把临界值说成确定结论。

> [!风险] 同套餐不等于同模型可用性
> 两张同套餐凭证的模型访问范围可能不同；偏用 A 时某个模型可能只有 B 有。缓解：建议只表达流量偏好，不替代 CPA 的可用性判断；请求仍会落到能服务该模型的凭证上。若这种情况反复出现，再考虑把模型可用性纳入池口径（本期不做）。

> [!风险] 同一账号的多张凭证看起来像两张卡
> 同一上游账号重复登记时，两张卡的读数和重置时刻可能完全相同，日均可用会落进「均衡」，不会给出错误偏用；如能确认是同一账号，直接排除在池外。判不准时按不同卡参与比较，并在风险里记录。

> [!风险] 建议被误读成「已经改了路由」
> 控制台出现偏用 / 少用后，运营人员可能以为请求已经自动偏向 A。缓解：建议块固定写「只提示，不改路由」；没有任何应用按钮；若 q01 选择写入权重，另立项目并重新设计文案和审计。

> [!风险] 短窗口耗尽但长窗口仍宽裕
> 一张卡的周窗口还很宽裕、5 小时窗口却已耗尽，此刻它并不能承接请求。缓解：可服务门槛把「有标准窗口耗尽且未重置」的卡排除在偏用之外，并在原因里写清是哪个窗口。

> [!风险] 池建议与单卡状态不同步
> 建议按页面时钟重算，但额度读数本身有鲜度界；读数过期后建议必须退成「无法建议」，不能继续用旧数据给偏用结论。缓解：鲜度界与现有额度预测一致，过期即降级。

本节的待确认：q01（路由权重）、q02（建议窗口范围）、q03（比较口径）、q04（快重置标记），都在对应小节里点选；页首会自动汇总。

el\">5 小时限额<\/span><span class=\"win-value\">—<\/span><\/div>\n          <div class=\"meter\"><i style=\"width:0\"><\/i><\/div>\n          <div class=\"win-foot\"><span class=\"win-reset\">尚无读数，点「刷新额度」获取<\/span><\/div>\n        <\/div>\n        <div class=\"window\">\n          <div class=\"win-head\"><span class=\"win-label\">周限额<\/span><span class=\"win-value\">—<\/span><\/div>\n          <div class=\"meter\"><i style=\"width:0\"><\/i><\/div>\n          <div class=\"win-foot\"><span class=\"win-reset\">尚无读数<\/span><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"actions\"><button class=\"linkbtn\">详情<\/button><\/div>\n    <\/div>\n\n    <div class=\"row\" data-order-default=\"5\" data-order-reset=\"4\">\n      <div class=\"identity\">\n        <span class=\"avatar violet\">KM<\/span>\n        <div><div class=\"name\">kimi_main<\/div><div class=\"meta\">Kimi · oauth · 套餐未知<\/div><\/div>\n      <\/div>\n      <div class=\"status\"><span class=\"pill primary\">正常<\/span><\/div>\n      <div><div class=\"switch\"><\/div><\/div>\n      <div class=\"traffic\"><b>157<\/b>今日请求<div class=\"tbar\"><i style=\"width:8%\"><\/i><\/div><\/div>\n      <div class=\"windows\">\n        <div class=\"window\">\n          <div class=\"win-head\"><span class=\"win-label\">月限额<\/span><span class=\"win-value\">91%<\/span><\/div>\n          <div class=\"meter\"><i style=\"width:91%;background:var(--brand)\"><\/i><\/div>\n          <div class=\"win-foot\"><span class=\"win-reset\">距重置 <b>7 天<\/b> · 11/30 12:00<\/span><\/div>\n        <\/div>\n        <div class=\"window\"><\/div>\n      <\/div>\n      <div class=\"actions\"><button class=\"linkbtn\">详情<\/button><\/div>\n    <\/div>\n  <\/div>\n<\/main>\n\n<script>\n(function () {\n  var rows = Array.prototype.slice.call(document.querySelectorAll('.row'));\n  var table = document.querySelector('.table');\n  var select = document.getElementById('sort-select');\n  function reorder(key) {\n    var copy = rows.slice().sort(function (a, b) {\n      return Number(a.getAttribute(key)) - Number(b.getAttribute(key));\n    });\n    copy.forEach(function (row) { table.appendChild(row); });\n  }\n  window.setState = function (name) {\n    document.body.dataset.state = name;\n    if (name === '按重置排序') {\n      reorder('data-order-reset');\n      select.value = 'reset';\n    } else {\n      reorder('data-order-default');\n      select.value = 'name';\n    }\n  };\n  select.addEventListener('change', function () {\n    window.setState(select.value === 'reset' ? '按重置排序' : '默认');\n    select.value = select.value;\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "拆借建议：有建议、无法建议、无同池", "file": "02-拆借建议-三种状态.html", "html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>拆借建议：有建议、无法建议、无同池<\/title>\n<style>\n:root {\n  --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-16: 16px; --fs-20: 20px; --fs-28: 28px;\n  --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px; --sp-32: 32px;\n  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;\n  --font: \"Segoe UI\", \"Microsoft YaHei UI\", \"PingFang SC\", system-ui, -apple-system, sans-serif;\n  --mono: \"Cascadia Mono\", ui-monospace, Consolas, monospace;\n  --bg: #f4f3ef; --panel: #ffffff; --panel-2: #f7f6f2; --line: #e6e3db; --text: #1f1e1b; --muted: #6f6b63; --faint: #9a968d;\n  --brand: #2f6f5e; --brand-soft: #e2efe9; --brand-text: #ffffff;\n  --red: #c2410c; --red-soft: #fdebdf; --orange: #b7791f; --orange-soft: #fbf1d9; --blue: #2563eb; --blue-soft: #e3ebfd;\n  --violet: #7c3aed; --violet-soft: #efe7fd; --gray-soft: #eeece6;\n  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) {\n  --bg: #141413; --panel: #1d1d1b; --panel-2: #242421; --line: #33322e; --text: #ecebe6; --muted: #a6a29a; --faint: #78756e;\n  --brand: #6cc3a8; --brand-soft: #1f3530; --brand-text: #10201b;\n  --red: #fb8a5c; --red-soft: #3a2216; --orange: #f2c15b; --orange-soft: #392e15; --blue: #8fb1ff; --blue-soft: #1c2742;\n  --violet: #b99cff; --violet-soft: #2a2140; --gray-soft: #2a2a27; --shadow: 0 1px 2px rgba(0,0,0,.3); } }\n:root[data-theme=\"dark\"] {\n  --bg: #141413; --panel: #1d1d1b; --panel-2: #242421; --line: #33322e; --text: #ecebe6; --muted: #a6a29a; --faint: #78756e;\n  --brand: #6cc3a8; --brand-soft: #1f3530; --brand-text: #10201b;\n  --red: #fb8a5c; --red-soft: #3a2216; --orange: #f2c15b; --orange-soft: #392e15; --blue: #8fb1ff; --blue-soft: #1c2742;\n  --violet: #b99cff; --violet-soft: #2a2140; --gray-soft: #2a2a27; --shadow: 0 1px 2px rgba(0,0,0,.3); }\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody { background: var(--bg); color: var(--text); font: 400 var(--fs-14)/1.6 var(--font); font-variant-numeric: tabular-nums; }\nh1 { font-size: var(--fs-28); line-height: 1.25; } h2 { font-size: var(--fs-20); line-height: 1.35; } h3 { font-size: var(--fs-16); }\nsmall, .small { font-size: var(--fs-12); }\na { color: var(--brand); }\n.appbar { height: 56px; display: flex; align-items: center; gap: var(--sp-24); padding: 0 var(--sp-24); background: var(--panel); border-bottom: 1px solid var(--line); }\n.brand { display: flex; align-items: center; gap: var(--sp-8); font-weight: 600; font-size: var(--fs-14); }\n.brandmark { width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--brand); color: var(--brand-text); display: grid; place-items: center; font-size: var(--fs-12); font-weight: 700; }\n.appnav { display: flex; gap: var(--sp-4); margin-left: var(--sp-8); }\n.appnav span { padding: var(--sp-4) var(--sp-12); border-radius: var(--r-sm); color: var(--muted); font-size: var(--fs-13); }\n.appnav span.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }\n.page { max-width: 1040px; margin: 0 auto; padding: var(--sp-24); }\n.head { margin-bottom: var(--sp-16); }\n.head h1 { margin: 0 0 var(--sp-4); }\n.sub { margin: 0; color: var(--muted); font-size: var(--fs-13); }\n.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow); overflow: hidden; }\n.advice-head { display: flex; align-items: center; gap: var(--sp-8); padding: var(--sp-12) var(--sp-16); border-bottom: 1px solid var(--line); flex-wrap: wrap; }\n.advice-head h2 { margin: 0; font-size: var(--fs-16); }\n.basis { color: var(--muted); font-size: var(--fs-12); }\n.pill { display: inline-flex; align-items: center; gap: var(--sp-4); padding: 2px var(--sp-8); border-radius: var(--r-pill); font-size: var(--fs-12); line-height: 1.7; border: 1px solid transparent; white-space: nowrap; }\n.pill.primary { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); font-weight: 600; }\n.pill.warn { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }\n.pill.info { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }\n.pill.gray { background: var(--gray-soft); color: var(--muted); }\n.pill.ghost { background: transparent; color: var(--muted); border-color: var(--line); }\n.pool { padding: var(--sp-12) var(--sp-16) var(--sp-16); }\n.pool + .pool { border-top: 1px dashed var(--line); }\n.pool-head { display: flex; align-items: baseline; gap: var(--sp-8); margin-bottom: var(--sp-8); flex-wrap: wrap; }\n.pool-title { font-size: var(--fs-14); font-weight: 600; }\n.pool-horizon { margin-left: auto; color: var(--muted); font-size: var(--fs-12); }\n.advice-row { display: grid; grid-template-columns: 68px 150px 1fr 1fr 1fr; gap: var(--sp-8); align-items: center; padding: var(--sp-8) 0; border-top: 1px solid var(--panel-2); }\n.advice-row:first-of-type { border-top: 0; }\n.cred { font-size: var(--fs-13); font-weight: 600; }\n.metric { font-size: var(--fs-13); color: var(--text); }\n.metric span { color: var(--muted); font-size: var(--fs-12); }\n.metric.reference { color: var(--violet); }\n.reason { margin: var(--sp-8) 0 0; padding: var(--sp-8) var(--sp-12); background: var(--panel-2); border-radius: var(--r-sm); color: var(--muted); font-size: var(--fs-13); }\n.reason b { color: var(--text); font-weight: 600; }\n.advice-foot { padding: var(--sp-8) var(--sp-16); border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-12); display: flex; gap: var(--sp-8); flex-wrap: wrap; }\n.state-block { display: none; }\nbody[data-state=\"有建议\"] .only-default { display: block; }\nbody[data-state=\"无法建议\"] .only-unknown { display: block; }\nbody[data-state=\"无同池\"] .only-empty { display: block; }\nbody[data-state=\"无法建议\"] .advice-foot,\nbody[data-state=\"无同池\"] .advice-foot { display: none; }\n.unknown-box { padding: var(--sp-16); }\n.unknown-head { display: flex; align-items: center; gap: var(--sp-8); margin-bottom: var(--sp-8); flex-wrap: wrap; }\n.unknown-head strong { font-size: var(--fs-14); }\n.reason-list { margin: 0; padding: 0; list-style: none; }\n.reason-list li { display: grid; grid-template-columns: 150px 1fr; gap: var(--sp-8); padding: var(--sp-8) 0; border-top: 1px solid var(--panel-2); font-size: var(--fs-13); }\n.reason-list li:first-child { border-top: 0; }\n.reason-list .who { font-weight: 600; }\n.reason-list .why { color: var(--muted); }\n.empty { padding: var(--sp-24) var(--sp-16); text-align: center; color: var(--muted); font-size: var(--fs-13); }\n.empty strong { display: block; color: var(--text); font-size: var(--fs-14); margin-bottom: var(--sp-4); }\n.empty .counts { margin-top: var(--sp-12); display: inline-flex; gap: var(--sp-16); flex-wrap: wrap; justify-content: center; }\n.empty .counts b { color: var(--text); }\n.note { margin: var(--sp-16) 0 0; color: var(--muted); font-size: var(--fs-12); }\n<\/style>\n<\/head>\n<body data-states=\"有建议,无法建议,无同池\" data-state=\"有建议\">\n<header class=\"appbar\">\n  <div class=\"brand\"><span class=\"brandmark\">OMC<\/span> Oh My CPA<\/div>\n  <nav class=\"appnav\">\n    <span>仪表盘<\/span><span>模型<\/span><span class=\"on\">凭证<\/span><span>洞察<\/span><span>设置<\/span>\n  <\/nav>\n<\/header>\n\n<main class=\"page\">\n  <div class=\"head\">\n    <h1>额度拆借建议<\/h1>\n    <p class=\"sub\">同 provider、同套餐的凭证组成一个可拆借池；建议只回答先偏用谁、少用谁，不写路由、不消耗重置权益。<\/p>\n  <\/div>\n\n  <section class=\"panel\">\n    <div class=\"advice-head\" data-note=\"1\">\n      <h2>本周建议<\/h2>\n      <span class=\"pill ghost\" data-note=\"9\">只提示，不改路由<\/span>\n      <span class=\"basis\">基于 11-23 11:20 的读数重算 · 页面时钟推进时同步更新<\/span>\n    <\/div>\n\n    <div class=\"only-default state-block\">\n      <div class=\"pool\" data-note=\"2\">\n        <div class=\"pool-head\">\n          <span class=\"pool-title\">Codex · Pro 200 · 周限额<\/span>\n          <span class=\"pill info\">2 张可拆借<\/span>\n          <span class=\"pool-horizon\">建议有效到 11/25 18:00（B 自然重置后重算）<\/span>\n        <\/div>\n        <div class=\"advice-row\" data-note=\"3\">\n          <span class=\"pill primary\">偏用<\/span>\n          <span class=\"cred\">codex_a<\/span>\n          <span class=\"metric\" data-note=\"4\"><b>88%<\/b> <span>剩余<\/span><\/span>\n          <span class=\"metric\"><b>3.9 天<\/b> <span>距重置<\/span><\/span>\n          <span class=\"metric\"><b>22.6%/天<\/b> <span>日均可用<\/span><\/span>\n        <\/div>\n        <div class=\"advice-row\">\n          <span class=\"pill warn\">少用<\/span>\n          <span class=\"cred\">codex_b<\/span>\n          <span class=\"metric\"><b>40%<\/b> <span>剩余<\/span><\/span>\n          <span class=\"metric\"><b>2.3 天<\/b> <span>距重置<\/span><\/span>\n          <span class=\"metric\"><b>17.6%/天<\/b> <span>日均可用<\/span><\/span>\n        <\/div>\n        <p class=\"reason\" data-note=\"5\"><b>A 距 11/27 09:00 自然重置还有 3.9 天、剩 88%<\/b>，每天可用约 22.6%；<b>B 距 11/25 18:00 只剩 2.3 天、剩 40%<\/b>，每天可用约 17.6%。先偏用 A，把 B 的 40% 留到回满；B 回满后按当时的余量和距重置时间重算。<\/p>\n      <\/div>\n\n      <div class=\"pool\">\n        <div class=\"pool-head\">\n          <span class=\"pool-title\">Claude · Max · 周限额<\/span>\n          <span class=\"pill info\">2 张可拆借<\/span>\n          <span class=\"pill ghost\">参考（推算重置）<\/span>\n          <span class=\"pool-horizon\">建议有效到 11/26 09:00（X 自然重置后重算）<\/span>\n        <\/div>\n        <div class=\"advice-row\">\n          <span class=\"pill primary\">偏用<\/span>\n          <span class=\"cred\">claude_x<\/span>\n          <span class=\"metric\"><b>78%<\/b> <span>剩余<\/span><\/span>\n          <span class=\"metric reference\" data-note=\"6\"><b>~2.9 天<\/b> <span>距重置（推算）<\/span><\/span>\n          <span class=\"metric\"><b>26.9%/天<\/b> <span>日均可用<\/span><\/span>\n        <\/div>\n        <div class=\"advice-row\">\n          <span class=\"pill warn\">少用<\/span>\n          <span class=\"cred\">claude_y<\/span>\n          <span class=\"metric\"><b>45%<\/b> <span>剩余<\/span><\/span>\n          <span class=\"metric\"><b>5.9 天<\/b> <span>距重置<\/span><\/span>\n          <span class=\"metric\"><b>7.6%/天<\/b> <span>日均可用<\/span><\/span>\n        <\/div>\n        <p class=\"reason\"><b>X 的重置时刻是上游按秒数推算的<\/b>，真实回满时刻可能有几小时偏差；按推算值，X 每天可用约 26.9%，比 Y 宽裕。先偏用 X；若读数刷新后 X 的重置时刻变化，建议会跟着重算，<span class=\"pill ghost\">参考<\/span> 标记保留到出现精确时刻为止。<\/p>\n      <\/div>\n    <\/div>\n\n    <div class=\"only-unknown state-block\">\n      <div class=\"pool\" data-note=\"2\">\n        <div class=\"pool-head\">\n          <span class=\"pool-title\">Codex · Pro 200 · 周限额<\/span>\n          <span class=\"pill gray\">2 张，无法建议<\/span>\n          <span class=\"pool-horizon\">等数据补齐后再比较<\/span>\n        <\/div>\n        <div class=\"unknown-box\">\n          <div class=\"unknown-head\"><strong>无法建议<\/strong><span class=\"pill ghost\">不给偏用 / 少用结论<\/span><\/div>\n          <ul class=\"reason-list\" data-note=\"7\">\n            <li><span class=\"who\">codex_d<\/span><span class=\"why\">上游只给了「11 月 27 日下午」的文字，没有可比较的重置时刻；确认上游能返回具体时刻后再比较。<\/span><\/li>\n            <li><span class=\"who\">codex_e<\/span><span class=\"why\">读数已过期：最后读数在 26 小时前，超过周窗口的鲜度界；先刷新额度，再按新读数重算。<\/span><\/li>\n          <\/ul>\n          <p class=\"reason\">数据不全时只显示原因，不按剩余百分比猜先后，也不把「无法建议」写成「均衡使用」。每张卡的单卡倒计时和剩余百分比仍照常显示。<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"only-empty state-block\">\n      <div class=\"empty\" data-note=\"8\">\n        <strong>暂无可拆借的同池凭证<\/strong>\n        同池需要同 provider、同套餐，且至少两张凭证有周期 24 小时以上的窗口读数。\n        <div class=\"counts\">\n          <span>凭证总数 <b>5<\/b><\/span>\n          <span>套餐未知 <b>1<\/b><\/span>\n          <span>同套餐不足 2 张 <b>2<\/b><\/span>\n          <span>读数不可用 <b>2<\/b><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"advice-foot\">\n      <span>未参与本页建议：1 张<\/span><span>·<\/span><span>Kimi（套餐未知）<\/span>\n    <\/div>\n  <\/section>\n\n  <p class=\"note\">建议是只读的：没有「应用」按钮，不写入 CPA 的 priority / weight，也不消耗 Codex 重置次数或 Claude 重置授权。<\/p>\n<\/main>\n\n<script>\nwindow.setState = function (name) {\n  document.body.dataset.state = name;\n};\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "凭证详情：拆借建议与重置权益建议", "file": "03-凭证详情-拆借说明.html", "html": "<!doctype html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>凭证详情：拆借建议与重置权益建议<\/title>\n<style>\n:root {\n  --fs-12: 12px; --fs-13: 13px; --fs-14: 14px; --fs-16: 16px; --fs-20: 20px; --fs-28: 28px;\n  --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px; --sp-32: 32px;\n  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 999px;\n  --font: \"Segoe UI\", \"Microsoft YaHei UI\", \"PingFang SC\", system-ui, -apple-system, sans-serif;\n  --mono: \"Cascadia Mono\", ui-monospace, Consolas, monospace;\n  --bg: #f4f3ef; --panel: #ffffff; --panel-2: #f7f6f2; --line: #e6e3db; --text: #1f1e1b; --muted: #6f6b63; --faint: #9a968d;\n  --brand: #2f6f5e; --brand-soft: #e2efe9; --brand-text: #ffffff;\n  --red: #c2410c; --red-soft: #fdebdf; --orange: #b7791f; --orange-soft: #fbf1d9; --blue: #2563eb; --blue-soft: #e3ebfd;\n  --violet: #7c3aed; --violet-soft: #efe7fd; --gray-soft: #eeece6;\n  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) {\n  --bg: #141413; --panel: #1d1d1b; --panel-2: #242421; --line: #33322e; --text: #ecebe6; --muted: #a6a29a; --faint: #78756e;\n  --brand: #6cc3a8; --brand-soft: #1f3530; --brand-text: #10201b;\n  --red: #fb8a5c; --red-soft: #3a2216; --orange: #f2c15b; --orange-soft: #392e15; --blue: #8fb1ff; --blue-soft: #1c2742;\n  --violet: #b99cff; --violet-soft: #2a2140; --gray-soft: #2a2a27; --shadow: 0 1px 2px rgba(0,0,0,.3); } }\n:root[data-theme=\"dark\"] {\n  --bg: #141413; --panel: #1d1d1b; --panel-2: #242421; --line: #33322e; --text: #ecebe6; --muted: #a6a29a; --faint: #78756e;\n  --brand: #6cc3a8; --brand-soft: #1f3530; --brand-text: #10201b;\n  --red: #fb8a5c; --red-soft: #3a2216; --orange: #f2c15b; --orange-soft: #392e15; --blue: #8fb1ff; --blue-soft: #1c2742;\n  --violet: #b99cff; --violet-soft: #2a2140; --gray-soft: #2a2a27; --shadow: 0 1px 2px rgba(0,0,0,.3); }\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody { background: var(--bg); color: var(--text); font: 400 var(--fs-14)/1.6 var(--font); font-variant-numeric: tabular-nums; }\nh1 { font-size: var(--fs-28); line-height: 1.25; } h2 { font-size: var(--fs-20); line-height: 1.35; } h3 { font-size: var(--fs-16); }\nsmall, .small { font-size: var(--fs-12); }\na { color: var(--brand); }\n.appbar { height: 56px; display: flex; align-items: center; gap: var(--sp-24); padding: 0 var(--sp-24); background: var(--panel); border-bottom: 1px solid var(--line); }\n.brand { display: flex; align-items: center; gap: var(--sp-8); font-weight: 600; font-size: var(--fs-14); }\n.brandmark { width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--brand); color: var(--brand-text); display: grid; place-items: center; font-size: var(--fs-12); font-weight: 700; }\n.page { max-width: 1232px; margin: 0 auto; padding: var(--sp-24); }\n.dimmed { opacity: .45; filter: saturate(.7); }\n.fake-head { display: flex; align-items: baseline; gap: var(--sp-8); margin-bottom: var(--sp-16); }\n.fake-head h1 { font-size: var(--fs-20); margin: 0; }\n.fake-rows { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }\n.fake-row { display: grid; grid-template-columns: 220px 100px 1fr 90px; gap: var(--sp-12); padding: var(--sp-12) var(--sp-16); border-bottom: 1px solid var(--line); font-size: var(--fs-13); }\n.fake-row:last-child { border-bottom: 0; }\n.muted { color: var(--muted); }\n\n.drawer-mask { position: fixed; inset: 0; background: rgba(0,0,0,.18); }\n.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 580px; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.08); display: flex; flex-direction: column; }\n.drawer-head { padding: var(--sp-16) var(--sp-24) var(--sp-12); border-bottom: 1px solid var(--line); }\n.drawer-title { display: flex; align-items: center; gap: var(--sp-8); }\n.avatar { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: var(--fs-12); font-weight: 700; background: var(--brand-soft); color: var(--brand); }\n.name { font-size: var(--fs-16); font-weight: 600; }\n.meta { color: var(--muted); font-size: var(--fs-12); }\n.close { margin-left: auto; color: var(--muted); font-size: var(--fs-14); }\n.tabs { display: flex; gap: var(--sp-4); padding: 0 var(--sp-24); border-bottom: 1px solid var(--line); }\n.tabs span { padding: var(--sp-8) var(--sp-12); color: var(--muted); font-size: var(--fs-13); border-bottom: 2px solid transparent; }\n.tabs span.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }\n.body { padding: var(--sp-16) var(--sp-24) var(--sp-24); overflow: auto; }\n.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-12) var(--sp-16); margin-bottom: var(--sp-16); }\n.panel.soft { background: var(--panel-2); }\n.panel-head { display: flex; align-items: center; gap: var(--sp-8); margin-bottom: var(--sp-8); flex-wrap: wrap; }\n.panel-head h3 { margin: 0; font-size: var(--fs-16); }\n.pill { display: inline-flex; align-items: center; gap: var(--sp-4); padding: 2px var(--sp-8); border-radius: var(--r-pill); font-size: var(--fs-12); line-height: 1.7; border: 1px solid transparent; white-space: nowrap; }\n.pill.primary { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); font-weight: 600; }\n.pill.warn { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }\n.pill.info { background: var(--blue-soft); color: var(--blue); border-color: var(--blue); }\n.pill.gray { background: var(--gray-soft); color: var(--muted); }\n.pill.ghost { background: transparent; color: var(--muted); border-color: var(--line); }\n.pool-line { display: flex; align-items: center; gap: var(--sp-8); color: var(--muted); font-size: var(--fs-12); margin-bottom: var(--sp-8); flex-wrap: wrap; }\n.pool-line b { color: var(--text); font-weight: 600; }\n.metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--sp-8); margin-bottom: var(--sp-8); }\n.metric { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--sp-8); }\n.metric b { display: block; font-size: var(--fs-16); }\n.metric span { color: var(--muted); font-size: var(--fs-12); }\n.reason { margin: 0 0 var(--sp-8); color: var(--muted); font-size: var(--fs-13); }\n.reason b { color: var(--text); font-weight: 600; }\n.basis { color: var(--faint); font-size: var(--fs-12); }\n.window { margin-top: var(--sp-12); }\n.win-head { display: flex; align-items: baseline; gap: var(--sp-4); }\n.win-label { color: var(--muted); font-size: var(--fs-12); }\n.win-value { margin-left: auto; font-size: var(--fs-14); font-weight: 600; }\n.meter { height: 8px; border-radius: var(--r-pill); background: var(--panel-2); margin: var(--sp-4) 0; overflow: hidden; }\n.meter i { display: block; height: 100%; border-radius: var(--r-pill); }\n.win-reset { color: var(--muted); font-size: var(--fs-12); }\n.win-reset b { color: var(--text); font-weight: 600; }\n.advice-view { display: none; }\nbody[data-state=\"默认\"] .advice-ok { display: block; }\nbody[data-state=\"无法建议\"] .advice-unknown { display: block; }\n.unknown-reason { margin: 0; padding-left: var(--sp-16); color: var(--muted); font-size: var(--fs-13); }\n.unknown-reason li { margin-bottom: var(--sp-4); }\n.distinction { border-left: 3px solid var(--line); padding-left: var(--sp-12); color: var(--muted); font-size: var(--fs-13); }\n.distinction b { color: var(--text); }\n<\/style>\n<\/head>\n<body data-states=\"默认,无法建议\" data-state=\"默认\">\n<header class=\"appbar\">\n  <div class=\"brand\"><span class=\"brandmark\">OMC<\/span> Oh My CPA<\/div>\n<\/header>\n\n<main class=\"page dimmed\" aria-hidden=\"true\">\n  <div class=\"fake-head\"><h1>凭证<\/h1><span class=\"muted\">共 5 张<\/span><\/div>\n  <div class=\"fake-rows\">\n    <div class=\"fake-row\"><span>codex_a<\/span><span class=\"muted\">正常<\/span><span class=\"muted\">5 小时 92% · 周限额 88%<\/span><span class=\"muted\">详情<\/span><\/div>\n    <div class=\"fake-row\"><span>codex_b<\/span><span class=\"muted\">余量偏低<\/span><span class=\"muted\">5 小时 70% · 周限额 40%<\/span><span class=\"muted\">详情<\/span><\/div>\n    <div class=\"fake-row\"><span>claude_max<\/span><span class=\"muted\">正常<\/span><span class=\"muted\">5 小时 80% · 周限额 72%<\/span><span class=\"muted\">详情<\/span><\/div>\n  <\/div>\n<\/main>\n\n<div class=\"drawer-mask\" aria-hidden=\"true\"><\/div>\n<aside class=\"drawer\" aria-label=\"凭证详情\">\n  <div class=\"drawer-head\">\n    <div class=\"drawer-title\">\n      <span class=\"avatar\">CA<\/span>\n      <div><div class=\"name\">codex_a<\/div><div class=\"meta\">Codex · oauth · Pro 200 · 最后读数 8 分钟前<\/div><\/div>\n      <span class=\"close\">关闭<\/span>\n    <\/div>\n  <\/div>\n  <div class=\"tabs\"><span class=\"on\">额度<\/span><span>详情<\/span><span>设置<\/span><\/div>\n  <div class=\"body\">\n    <div class=\"panel soft\">\n      <div class=\"panel-head\"><h3>额度拆借建议<\/h3><span class=\"pill ghost\">只提示<\/span><\/div>\n      <div class=\"advice-view advice-ok\" data-note=\"1\">\n        <div class=\"pool-line\" data-note=\"2\">属于 <b>Codex · Pro 200 · 周限额<\/b> 池（同套餐 2 张）<span class=\"pill primary\">偏用<\/span><\/div>\n        <div class=\"metrics\">\n          <div class=\"metric\"><b>88%<\/b><span>剩余<\/span><\/div>\n          <div class=\"metric\"><b>3.9 天<\/b><span>距自然重置<\/span><\/div>\n          <div class=\"metric\"><b>22.6%/天<\/b><span>重置前日均可用<\/span><\/div>\n        <\/div>\n        <p class=\"reason\" data-note=\"3\">同池的 <b>codex_b<\/b> 剩 40%、2.3 天后回满，每天约 17.6%；A 比它宽裕，先偏用 A，把 B 的余量留到 11/25 18:00 回满。<\/p>\n        <div class=\"basis\">依据 11-23 11:20 的读数 · 建议有效到 11/25 18:00 · <a href=\"#\" onclick=\"return false\">查看同池建议<\/a><\/div>\n      <\/div>\n      <div class=\"advice-view advice-unknown\">\n        <div class=\"pool-line\" data-note=\"2\">属于 <b>Codex · Pro 200 · 周限额<\/b> 池（同套餐 2 张）<span class=\"pill gray\">无法建议<\/span><\/div>\n        <ul class=\"unknown-reason\" data-note=\"3\">\n          <li>同池的 codex_b 读数已过期，不能比较；先刷新它的额度。<\/li>\n          <li>数据补齐前不按剩余百分比猜先后；本卡的倒计时和剩余百分比仍照常显示。<\/li>\n        <\/ul>\n        <div class=\"basis\">依据 11-23 11:20 的读数 · 等同池读数有效后自动重算<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <div class=\"panel-head\"><h3>额度窗口<\/h3><span class=\"pill gray\">2 个窗口<\/span><\/div>\n      <div class=\"window\" data-note=\"4\">\n        <div class=\"win-head\"><span class=\"win-label\">5 小时限额<\/span><span class=\"win-value\">92%<\/span><\/div>\n        <div class=\"meter\"><i style=\"width:92%;background:var(--brand)\"><\/i><\/div>\n        <div class=\"win-reset\">距重置 <b>3 小时<\/b> · 11/23 14:20<\/div>\n      <\/div>\n      <div class=\"window\">\n        <div class=\"win-head\"><span class=\"win-label\">周限额<\/span><span class=\"win-value\">88%<\/span><\/div>\n        <div class=\"meter\"><i style=\"width:88%;background:var(--brand)\"><\/i><\/div>\n        <div class=\"win-reset\">距重置 <b>3.9 天<\/b> · 11/27 09:00<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\">\n      <div class=\"panel-head\"><h3>重置权益建议<\/h3><span class=\"pill warn\" data-note=\"5\">到期前用掉<\/span><\/div>\n      <p class=\"reason\" data-note=\"5\">还有 <b>1 次<\/b> Codex 重置次数，最早 <b>11/25 22:00<\/b> 到期。当前周限额已用 12%，没有接近 90% 的应急阈值，建议在到期前用掉这次重置，别让它过期。<\/p>\n      <div class=\"basis\">这是原来那张单卡建议：只看重置次数 / 授权的到期时间，不比较其他凭证。<\/div>\n    <\/div>\n\n    <p class=\"distinction\" data-note=\"6\"><b>两者不是一回事。<\/b>拆借建议回答「接下来偏用哪张卡」，看的是自然重置前的余量分配；重置权益建议回答「要不要用掉重置次数」，看的是权益到期时间。拆借建议不会消耗重置次数，也不会因为重置权益建议改变。<\/p>\n  <\/div>\n<\/aside>\n\n<script>\nwindow.setState = function (name) {\n  document.body.dataset.state = name;\n};\n<\/script>\n<\/body>\n<\/html>\n"}], FIGS = [{"caption": "一次额度读数怎么变成行内倒计时与标记", "src": "flowchart TD\n  A[读到一张凭证的窗口] --> B{有具体重置时刻吗}\n  B -- 有 --> C{精度是精确吗}\n  C -- 是 --> D[显示 距重置 X]\n  C -- 否 --> E[显示 ~距重置 X，标注推算]\n  B -- 没有 --> F{上游给了文字标签吗}\n  F -- 有 --> G[显示上游文字，标 时刻未知]\n  F -- 没有 --> H[显示 重置时刻未知]\n  D --> I{周期已知且距重置 ≤ 周期 1/3?}\n  E --> I\n  I -- 是 --> J{剩余 ≥ 50%?}\n  J -- 是 --> K[快重置 · 余量高]\n  J -- 否 --> L[快重置 · 余量低]\n  I -- 否 --> M[不打标记]"}, {"caption": "同池建议从分组到给出结论", "src": "flowchart TD\n  A[读到的凭证与长窗口] --> B{同 provider + 同 plan_type 且未停用的卡 ≥ 2?}\n  B -- 否 --> Z1[不成池，不显示建议]\n  B -- 是 --> C{池成员的比较数据都有效?}\n  C -- 否 --> Z2[无法建议：逐卡写原因]\n  C -- 是 --> D{各卡的瓶颈窗口类型相同?}\n  D -- 否 --> Z3[无法建议：窗口口径不同]\n  D -- 是 --> E[算每张卡的重置前日均可用]\n  E --> F[标出不能承接当前流量的卡]\n  F --> G{可服务的卡 ≥ 2?}\n  G -- 否 --> Z4[不给偏用结论；列出受限卡]\n  G -- 是 --> H{最高与最低差 ≥ 1 个百分点/天?}\n  H -- 否 --> Z5[均衡使用，不分偏用 / 少用]\n  H -- 是 --> I[最高标偏用，最低标少用，其余正常]\n  I --> J[写有效期到同池最早的自然重置]"}, {"caption": "一个同池建议的几种状态", "src": "stateDiagram-v2\n  [*] --> 可比较\n  可比较 --> 无法建议: 缺重置时刻 / 读数过期 / 缺长窗口\n  可比较 --> 无法建议: 瓶颈窗口类型不同 / 可用卡 }
function noteKey(scr, no) { const t = targets.find(t => t.kind === "note" && t.parent === scr.t.key && t.no === no); return t ? t.key : scr.t.key; }
function focusNote(scr, no) {
  const li = scr.notesEl && [...scr.notesEl.children].find(x => x.dataset.no === no); if (!li) return;
  li.scrollIntoView({ block: "nearest", behavior: "smooth" }); flash(li);
}
function setFrameState(scr, name) {
  const fd = scr.frame.contentDocument, win = scr.frame.contentWindow; if (!fd) return;
  scr.cur = name; fd.body.dataset.state = name;
  try { if (typeof win.setState === "function") win.setState(name); } catch (e) {}
  scr.statesEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.st === name));
  schedule(scr);
}
function pathOf(el) {
  const parts = [];
  while (el && el.nodeType === 1 && el.tagName !== "BODY") {
    let i = 1, s = el; while ((s = s.previousElementSibling)) if (s.tagName === el.tagName) i++;
    parts.unshift(el.tagName.toLowerCase() + (el.id ? "#" + el.id : "") + `:nth-of-type(${i})`); el = el.parentElement;
  }
  return parts.join(" > ");
}
function markFrame(scr) {
  const fd = scr.frame.contentDocument; if (!fd) return;
  const want = new Set();
  state.comments.filter(c => c.target === scr.t.key && c.el && c.el.path).forEach(c => { try { const x = fd.querySelector(c.el.path); x && want.add(x); } catch (e) {} });
  fd.querySelectorAll(".nz-marked").forEach(x => { if (!want.has(x)) x.classList.remove("nz-marked"); });
  want.forEach(x => { if (!x.classList.contains("nz-marked")) x.classList.add("nz-marked"); });
}
const ro = new ResizeObserver(es => es.forEach(e => { const scr = screensRT.find(s => s.stage === e.target); scr && schedule(scr); }));
screensRT.forEach(s => ro.observe(s.stage));

// ---------- 评论与结论 ----------
const commentsOf = key => state.comments.filter(c => c.target === key);
const countAll = t => state.comments.filter(c => c.target === t.key || (byKey[c.target] && byKey[c.target].parent === t.key)).length;
// opts.edit：改哪条评论；opts.quiet：不抢焦点（恢复草稿时）。没保存的内容存成草稿，页面刷新或被浏览器重新加载也不丢
function openBox(key, el, opts = {}) {
  const t = byKey[key]; if (!t) return;
  t.thread.querySelector(".newbox")?.remove();
  const old = opts.edit ? state.comments.find(c => c.id === opts.edit) : null, draft = state.drafts[key];
  if (old) el = old.el;
  const div = document.createElement("div"); div.className = "thread newbox";
  const v = state.verdicts[key];
  div.innerHTML = (el ? `<div class="meta">针对元素：「${esc(el.text)}」${el.note ? ` · 编号 ${esc(el.note)}` : ""}${el.state ? ` · 状态：${esc(el.state)}` : ""}</div>` : "") +
    (old ? '<div class="meta">改这条评论</div>' : v && v !== "pass" ? `<div class="meta">结论：${VERDICTS[v]}，写一句为什么</div>` : "") +
    `<textarea rows="3" placeholder="写下你的意见…（Ctrl+Enter 保存）"></textarea><div class="row"><button class="primary">保存</button><button>取消</button></div>`;
  t.thread.prepend(div); const ta = div.querySelector("textarea");
  ta.value = draft && (draft.edit || 0) === (opts.edit || 0) ? draft.text : old ? old.text : "";
  if (!opts.quiet) ta.focus();
  const [ok, cancel] = div.querySelectorAll("button");
  const drop = () => { delete state.drafts[key]; save(); div.remove(); };
  ta.addEventListener("input", () => { state.drafts[key] = { text: ta.value, el, edit: opts.edit || 0 }; save(); });
  ok.onclick = () => {
    const text = ta.value.trim(); if (!text) return;
    if (old) { old.text = text; old.t = new Date().toISOString(); }
    else state.comments.push({ id: Date.now(), target: key, title: t.title, el, text, t: new Date().toISOString() });
    drop(); render();
  };
  cancel.onclick = drop;
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ok.click(); });
}
function stats() {
  const vt = targets.filter(t => t.verdictable), c = { total: vt.length, seen: 0, pass: 0, ask: 0, fix: 0 };
  vt.forEach(t => { const v = state.verdicts[t.key]; if (v) { c.seen++; c[v]++; } });
  return c;
}
function render() {
  for (const t of targets) {
    if (!t.thread) continue;
    t.thread.querySelectorAll(".thread:not(.newbox)").forEach(x => x.remove());
    for (const c of commentsOf(t.key)) {
      const d = document.createElement("div"); d.className = "thread";
      d.innerHTML = (c.el ? `<div class="meta">元素：「${esc(c.el.text)}」${c.el.note ? ` · 编号 ${esc(c.el.note)}` : ""}${c.el.state ? ` · 状态：${esc(c.el.state)}` : ""}</div>` : "") +
        `<p class="c">${esc(c.text)}</p><div class="meta">${when(c.t)}<button data-edit="${c.id}">改</button><button data-del="${c.id}">删除</button></div>`;
      t.thread.appendChild(d);
    }
    if (t.verdictable) {
      const v = state.verdicts[t.key] || "";
      t.node.classList.remove("v-pass", "v-ask", "v-fix"); if (v) t.node.classList.add("v-" + v);
      t.node.querySelector(`.vd[data-k="${CSS.escape(t.key)}"]`)?.querySelectorAll("[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === v));
    }
  }
  for (const p of pendsRT) {
    const a = state.answers[p.t.key], ta = p.node.querySelector("[data-other]");
    p.node.querySelectorAll(".opt").forEach(l => { const on = !!a && String(a.pick) === l.dataset.j; l.classList.toggle("sel", on); l.querySelector("input").checked = on; });
    ta.hidden = !(a && a.pick === "other"); if (document.activeElement !== ta) ta.value = (a && a.other) || "";
    p.node.classList.toggle("answered", !!a);
    const label = a ? "已选 " + (a.pick === "other" ? "自己写" : LETTER(a.pick) + (p.q.options[a.pick] && p.q.options[a.pick].rec ? "（推荐）" : "")) : "还没选";
    for (const el of [p.node.querySelector(".blk-head .st"), document.querySelector(`[data-pst="${p.t.dom}"]`)]) if (el) { el.textContent = label; el.className = "st " + (a ? "done" : "todo"); }
  }
  const st = stats(), np = pendsRT.filter(p => state.answers[p.t.key]).length;
  if ($("pendCount")) $("pendCount").textContent = ` · 已选 ${np}`;
  $("fill").style.width = (st.total ? st.seen / st.total * 100 : 0) + "%";
  $("ptext").innerHTML = `已看 ${st.seen} / ${st.total}，<span class="n-pass">通过 ${st.pass}</span>、<span class="n-ask">有疑问 ${st.ask}</span>、<span class="n-fix">要改 ${st.fix}</span> · ${state.comments.length} 条评论` +
    (pendsRT.length ? ` · <span class="${np < pendsRT.length ? "n-ask" : "n-pass"}">待确认已选 ${np} / ${pendsRT.length}</span>` : "");
  $("nav").innerHTML = targets.filter(t => t.verdictable).map(t => {
    const v = state.verdicts[t.key] || "", n = countAll(t);
    return `<a href="#${t.dom}" data-jump="${t.dom}" class="${t.kind === "sec" && !t.sub ? "" : "sub"}${v ? " v-" + v : ""}"><i class="dot${v ? " v-" + v : ""}"></i><span class="lb">${esc(t.nav)}</span>${n ? `<span class="badge">${n}</span>` : ""}</a>`;
  }).join("");
  document.body.classList.toggle("only-open", !!state.onlyOpen);
  $("btnOpen").classList.toggle("on", !!state.onlyOpen);
  screensRT.forEach(markFrame);
}

document.addEventListener("click", e => {
  const x = e.target.closest("[data-v], [data-c], [data-zoom], [data-pick], [data-del], [data-edit], [data-rec], [data-unpick], #btnRecAll, [data-st], [data-jump], .ac[href], .note .no");
  if (!x) return;
  const pend = pendsRT.find(p => p.node.contains(x));
  if (x.matches("[data-v]")) {
    const key = x.closest(".vd").dataset.k, v = x.dataset.v;
    if (state.verdicts[key] === v) delete state.verdicts[key]; else state.verdicts[key] = v;
    save(); render();
    if (state.verdicts[key] && v !== "pass" && !commentsOf(key).length) openBox(key);
  } else if (x.matches("[data-c]")) openBox(x.closest(".vd").dataset.k);
  else if (x.matches("[data-zoom]")) {
    const blk = x.closest(".blk"), on = blk.classList.toggle("zoom");
    x.textContent = on ? "还原" : "放大"; document.body.classList.toggle("noscroll", !!document.querySelector(".zoom"));
    const scr = screensRT.find(s => s.t.node === blk); scr && schedule(scr);
  } else if (x.matches("[data-pick]")) {
    const key = targets.find(t => t.node === x.closest(".screen")).key;
    picking = picking === key ? null : key;
    document.querySelectorAll("[data-pick]").forEach(b => b.classList.toggle("on", picking && b.closest(".screen") === byKey[picking].node));
  } else if (x.matches("[data-del]")) { state.comments = state.comments.filter(c => String(c.id) !== x.dataset.del); save(); render(); }
  else if (x.matches("[data-edit]")) { const c = state.comments.find(c => String(c.id) === x.dataset.edit); c && openBox(c.target, null, { edit: c.id }); }
  else if (x.matches("[data-rec]")) { state.answers[pend.t.key] = { pick: pend.recI, other: "" }; save(); render(); }
  else if (x.matches("[data-unpick]")) { delete state.answers[pend.t.key]; save(); render(); }
  else if (x.matches("#btnRecAll")) { pendsRT.forEach(p => { if (p.recI >= 0 && !state.answers[p.t.key]) state.answers[p.t.key] = { pick: p.recI, other: "" }; }); save(); render(); }
  else if (x.matches("[data-st]")) { const scr = screensRT.find(s => s.t.node === x.closest(".screen")); scr && setFrameState(scr, x.dataset.st); }
  else if (x.matches(".note .no")) { const scr = screensRT.find(s => s.t.node === x.closest(".screen")); if (scr) { hl(scr, x.dataset.no); scr.stage.scrollIntoView({ block: "nearest", behavior: "smooth" }); } }
  else {
    const el = document.getElementById(x.dataset.jump || "ac-" + x.dataset.ac); if (!el) return;
    e.preventDefault(); el.scrollIntoView({ block: "center", behavior: "smooth" }); flash(el);
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  document.querySelectorAll(".zoom").forEach(b => { b.classList.remove("zoom"); const z = b.querySelector("[data-zoom]"); if (z) z.textContent = "放大"; const scr = screensRT.find(s => s.t.node === b); scr && schedule(scr); });
  document.body.classList.remove("noscroll");
});
document.addEventListener("change", e => {  // 待确认：选了哪个
  const r = e.target.closest(".pend input[type=radio]"); if (!r) return;
  const p = pendsRT.find(p => p.node.contains(r)), prev = state.answers[p.t.key] || {};
  state.answers[p.t.key] = { pick: r.value === "other" ? "other" : +r.value, other: prev.other || "" };
  save(); render();
  if (r.value === "other") p.node.querySelector("[data-other]").focus();
});
document.addEventListener("input", e => {  // 待确认：自己写的答案
  if (!e.target.matches("[data-other]")) return;
  const p = pendsRT.find(p => p.node.contains(e.target));
  state.answers[p.t.key] = { pick: "other", other: e.target.value }; save(); render();
});
$("btnOpen").onclick = () => { state.onlyOpen = !state.onlyOpen; save(); render(); };
render();
for (const [k, d] of Object.entries(state.drafts)) if (byKey[k] && d && d.text) openBox(k, d.el, { edit: d.edit, quiet: true });
drawFigs();

// ---------- 导出：先结论汇总，再逐条意见 ----------
function where(c) {
  const t = byKey[c.target], e = c.el;
  return (t ? t.title : (c.title || c.target) + "（PRD 改过，位置可能变了）") +
    (e ? ` · 元素「${e.text}」\`${e.path}\`${e.note ? ` · 编号 ${e.note}` : ""}${e.state ? `（状态：${e.state}）` : ""}` : "");
}
function exportMd() {
  const st = stats(), vt = targets.filter(t => t.verdictable), cell = s => String(s).replace(/\|/g, "\\|");
  const L = [`# 评审意见 · ${document.title}`, "",
    `> 来自 ${SOURCE}。已看 ${st.seen} / ${st.total}：通过 ${st.pass}、有疑问 ${st.ask}、要改 ${st.fix}；评论 ${state.comments.length} 条` +
    (pendsRT.length ? `；待确认已选 ${pendsRT.filter(p => state.answers[p.t.key]).length} / ${pendsRT.length}` : "") + "。请产品 Agent 逐条处理后更新 PRD 和原型。", "",
    "## 结论汇总", ""];
  const rows = vt.filter(t => (state.verdicts[t.key] && state.verdicts[t.key] !== "pass") || countAll(t));
  if (rows.length) { L.push("| 位置 | 结论 | 评论 |", "|---|---|---|"); rows.forEach(t => L.push(`| ${cell(t.title)} | ${VERDICTS[state.verdicts[t.key]] || "没给结论"} | ${countAll(t)} |`)); }
  else L.push("_没有要改或有疑问的地方。_");
  const passed = vt.filter(t => state.verdicts[t.key] === "pass" && !countAll(t)), unseen = vt.filter(t => !state.verdicts[t.key]);
  if (passed.length) L.push("", `**通过（${passed.length}）**：${passed.map(t => t.title).join("、")}`);
  if (unseen.length) L.push("", `**没看（${unseen.length}）**：${unseen.map(t => t.title).join("、")}`);
  if (pendsRT.length) {
    L.push("", "## 待确认的选择", "", "| 编号 | 问题 | 选择 | 推荐 |", "|---|---|---|---|");
    for (const p of pendsRT) {
      const a = state.answers[p.t.key], rec = p.recI >= 0 ? `${LETTER(p.recI)}. ${p.q.options[p.recI].label}` : "（没写推荐）";
      L.push(`| ${cell(p.t.no)} | ${cell(p.q.title)} | ${cell(a ? pickLabel(p, a).replace(/\n/g, " / ") : "**没选**")} | ${cell(rec)} |`);
    }
  }
  L.push("", "## 逐条意见", "");
  const order = targets.map(t => t.key), orphan = state.comments.filter(c => !byKey[c.target]);
  const cs = state.comments.filter(c => byKey[c.target]).sort((a, b) => order.indexOf(a.target) - order.indexOf(b.target) || a.id - b.id);
  for (const c of cs.concat(orphan)) {
    const t = byKey[c.target], v = t && t.verdictable ? state.verdicts[t.key] : "";
    L.push(`- **[${where(c)}]**${v ? `（${VERDICTS[v]}）` : ""} ${c.text.replace(/\n/g, " / ")}`);
  }
  if (!state.comments.length) L.push("_没有评论。_");
  return L.join("\n");
}
$("btnExport").onclick = () => { $("out").value = exportMd(); $("dlg").showModal(); };
$("btnClose").onclick = () => $("dlg").close();
$("btnCopy").onclick = async () => { try { await navigator.clipboard.writeText($("out").value); } catch (e) { $("out").select(); document.execCommand("copy"); } };
$("btnDl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([$("out").value], { type: "text/markdown" })); a.download = SLUG + "-comments.md"; a.click(); };
$("btnClear").onclick = () => { if (confirm("清空全部评论、结论和待确认的选择？")) { state.comments = []; state.verdicts = {}; state.answers = {}; state.drafts = {}; save(); document.querySelectorAll(".newbox").forEach(x => x.remove()); render(); $("dlg").close(); } };
function frameTheme(scr) { const r = scr.frame.contentDocument && scr.frame.contentDocument.documentElement; if (r) state.theme ? r.dataset.theme = state.theme : delete r.dataset.theme; }
function applyTheme() { state.theme ? document.documentElement.dataset.theme = state.theme : delete document.documentElement.dataset.theme; screensRT.forEach(frameTheme); }
$("btnTheme").onclick = () => { state.theme = isDark() ? "light" : "dark"; save(); applyTheme(); drawFigs(); };
applyTheme();
</script>
</body>
</html>
