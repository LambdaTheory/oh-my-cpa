# Dokploy Compose deployment that builds this fork from source.
#
# Point a Dokploy "Compose" service at this repository with Compose Path
# `./deploy/dokploy/compose.yml`. Secrets come from the Dokploy Environment tab;
# never commit them. The service joins the external `dokploy-network` so it can
# reach CPA by its internal hostname.
#
# Only one usage collector may own CPA's usage stream. Keep
# OMCPA_USAGE_INGEST_MODE=off until the other collector (for example cpamp) has
# been stopped or the dual-subscriber trade-off has been accepted.
services:
  omc:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: fork
        BUILD_TAG: ${OMCPA_BUILD_VERSION:-}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    # The root filesystem is read-only; SQLite and the Go runtime may still need
    # a scratch /tmp.
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OMCPA_LISTEN_ADDR: ":8080"
      OMCPA_BASE_PATH: ${OMCPA_BASE_PATH:-/omc}
      OMCPA_DATA_DIR: /data
      OMCPA_CPA_BASE_URL: ${OMCPA_CPA_BASE_URL:?set OMCPA_CPA_BASE_URL}
      OMCPA_CPA_USAGE_ADDR: ${OMCPA_CPA_USAGE_ADDR:-}
      OMCPA_CPA_MANAGEMENT_KEY: ${OMCPA_CPA_MANAGEMENT_KEY:?set OMCPA_CPA_MANAGEMENT_KEY}
      OMCPA_MASTER_KEY: ${OMCPA_MASTER_KEY:?set OMCPA_MASTER_KEY}
      OMCPA_PUBLIC_URL: ${OMCPA_PUBLIC_URL:?set OMCPA_PUBLIC_URL}
      OMCPA_MCP_READONLY_KEY: ${OMCPA_MCP_READONLY_KEY:-}
      OMCPA_TRUSTED_PROXY_CIDRS: ${OMCPA_TRUSTED_PROXY_CIDRS:-}
      OMCPA_USAGE_INGEST_MODE: ${OMCPA_USAGE_INGEST_MODE:-off}
      OMCPA_QUOTA_SCHEDULER_ENABLED: ${OMCPA_QUOTA_SCHEDULER_ENABLED:-true}
      OMCPA_QUOTA_SCHEDULER_MODE: ${OMCPA_QUOTA_SCHEDULER_MODE:-interval}
      OMCPA_QUOTA_WATCH_INTERVAL: ${OMCPA_QUOTA_WATCH_INTERVAL:-5m}
      OMCPA_QUOTA_ACTIVE_INTERVAL: ${OMCPA_QUOTA_ACTIVE_INTERVAL:-15m}
      OMCPA_QUOTA_NORMAL_INTERVAL: ${OMCPA_QUOTA_NORMAL_INTERVAL:-30m}
      OMCPA_QUOTA_IDLE_INTERVAL: ${OMCPA_QUOTA_IDLE_INTERVAL:-2h}
      OMCPA_QUOTA_CREDENTIAL_FLOOR: ${OMCPA_QUOTA_CREDENTIAL_FLOOR:-10m}
      OMCPA_QUOTA_CREDENTIAL_FLOOR_BY_PROVIDER: ${OMCPA_QUOTA_CREDENTIAL_FLOOR_BY_PROVIDER:-claude=10m,codex=5m,antigravity=5m}
      OMCPA_QUOTA_REFRESH_CONCURRENCY: ${OMCPA_QUOTA_REFRESH_CONCURRENCY:-4}
      OMCPA_UPDATE_CHECK_ENABLED: ${OMCPA_UPDATE_CHECK_ENABLED:-false}
      OMCPA_UPDATE_CHECK_ON_PAGE_LOAD: ${OMCPA_UPDATE_CHECK_ON_PAGE_LOAD:-false}
      OMCPA_UPDATER_ENABLED: ${OMCPA_UPDATER_ENABLED:-false}
      # The tri-state switches are passed through with an empty default. An unset
      # variable must stay unset so the console's own switch is in force; writing a
      # hard `false` here would silently disable the web toggle.
      OMCPA_ACCOUNT_AUTOMATION_ENABLED: ${OMCPA_ACCOUNT_AUTOMATION_ENABLED:-}
      OMCPA_FEISHU_ENABLED: ${OMCPA_FEISHU_ENABLED:-}
      OMCPA_FEISHU_FORCE_DISABLED: ${OMCPA_FEISHU_FORCE_DISABLED:-}
      OMCPA_FEISHU_APP_ID: ${OMCPA_FEISHU_APP_ID:-}
      OMCPA_FEISHU_APP_SECRET: ${OMCPA_FEISHU_APP_SECRET:-}
      OMCPA_FEISHU_CHAT_ID: ${OMCPA_FEISHU_CHAT_ID:-}
      OMCPA_OLLAMA_COLLECTOR_ENABLED: ${OMCPA_OLLAMA_COLLECTOR_ENABLED:-true}
    volumes:
      - omc-data:/data
    networks:
      - dokploy-network

volumes:
  omc-data:

networks:
  dokploy-network:
    external: true
